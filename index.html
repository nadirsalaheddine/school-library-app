<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F9F8F6">
<title>LYCÉE CENTRAL LIBRARY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
:root{--bg:#F9F8F6;--card:#FFFFFFD9;--ink:#1C1917;--acc:#8B5E3C;--ok:#10B981;--bad:#E11D48;--soon:#F59E0B;--mut:#78716C;--line:#1c191714;--sh:0 12px 36px rgba(90,60,30,.10)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.65;background-image:radial-gradient(600px 380px at 95% -5%,#8B5E3C2e,transparent),radial-gradient(520px 360px at -5% 25%,#F59E0B1f,transparent),radial-gradient(500px 400px at 60% 100%,#8B5E3C18,transparent);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.glass{background:var(--card);backdrop-filter:blur(20px) saturate(1.7);-webkit-backdrop-filter:blur(20px) saturate(1.7);border:1px solid #ffffffcc;box-shadow:var(--sh);border-radius:20px}

/* header */
.hd{position:sticky;top:max(10px,env(safe-area-inset-top));z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;max-width:1100px;width:calc(100% - 24px);margin:10px auto;padding:10px 14px}
.brand{display:flex;align-items:center;gap:9px;font:italic 600 1rem "Playfair Display",Georgia,serif;letter-spacing:.14em;color:var(--acc);white-space:nowrap}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#A8764F,#8B5E3C);color:#fff;box-shadow:0 6px 14px #8B5E3C44}
.srch{flex:1 1 100%;order:3;display:flex;align-items:center;gap:8px;background:#1c19170a;border:1px solid transparent;border-radius:14px;padding:9px 14px;color:var(--mut);transition:.2s}
.srch:focus-within{background:#fff;border-color:#8B5E3C55;box-shadow:0 0 0 4px #8B5E3C18}
.srch input{border:0;background:none;padding:0;outline:0;width:100%}
@media(min-width:700px){.srch{order:0;flex-basis:300px}}
.qa{margin-inline-start:auto;display:flex;gap:4px}
.ib{position:relative;width:42px;height:42px;border-radius:13px;display:inline-grid;place-items:center;color:var(--acc);transition:background .2s}
.ib:hover{background:#8B5E3C14}.ib.on{color:var(--soon)}
.cnt{position:absolute;top:3px;inset-inline-end:3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:.65rem;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ticker */
.ticker{max-width:1100px;width:calc(100% - 24px);margin:0 auto;overflow:hidden;padding:9px 0;font-size:.9rem;color:var(--acc);direction:rtl;border-radius:16px}
.track{display:flex;width:max-content;animation:mq 36s linear infinite}
.track:hover{animation-play-state:paused}
.g{display:flex;align-items:center;gap:18px;padding-inline:9px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--soon);flex:none}
@keyframes mq{to{transform:translateX(50%)}}

/* hero */
.hero{max-width:1100px;margin:0 auto;padding:26px 18px 8px}
.hero h1{font-size:clamp(1.6rem,6vw,2.5rem);font-weight:800;line-height:1.25;letter-spacing:-.01em}
.hero p{color:var(--mut);margin:6px 0 14px;max-width:46ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;max-width:1100px;margin:0 auto;padding:8px 12px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;background:#fff;box-shadow:0 1px 5px #1c19171a;font-size:.9rem;transition:.2s}
.chip.on{background:linear-gradient(135deg,#A8764F,#8B5E3C);color:#fff;box-shadow:0 6px 16px #8B5E3C44}

/* shelves + cards */
main{max-width:1100px;margin:0 auto;padding:0 12px 30px}
section{margin-top:22px}
section>h2{display:flex;align-items:center;gap:8px;font-size:1.1rem;margin-bottom:14px;padding-inline:4px}
section>h2::after{content:"";flex:1;height:1px;background:linear-gradient(to left,transparent,#8B5E3C40)}
h2 svg{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.card{position:relative;padding:10px;cursor:pointer;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(90,60,30,.18)}
.cv{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;color:#EBD9B4;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 8px 18px #0003,inset 0 0 0 1px #fff2}
.cv::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:10px;background:linear-gradient(90deg,#0000004d,#ffffff22 60%,#0000001a)}
.ft{position:absolute;inset:10px 10px 10px 18px;border:1px solid #EBD9B466;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px;font-weight:700;line-height:1.35}
.ft small{font-weight:400;font-size:.7rem;opacity:.8}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hb{position:absolute;top:16px;inset-inline-end:16px;z-index:2;width:34px;height:34px;border-radius:50%;background:#ffffffd9;backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--acc);box-shadow:0 2px 8px #0002}
.hb.on{color:var(--bad)}.hb.on svg{fill:var(--bad)}
.meta{padding-top:10px}.meta h3{font-size:.95rem;line-height:1.4;margin:6px 0 2px}.meta p{font-size:.8rem;color:var(--mut)}
.bd{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px}
.bd.available{background:#10B9811f;color:#047857}.bd.borrowed{background:#E11D481a;color:#BE123C}.bd.coming_soon{background:#F59E0B26;color:#B45309}
.mut{color:var(--mut);font-size:.85rem}.empty{text-align:center;color:var(--mut);padding:48px 12px}

/* buttons + forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-radius:14px;background:linear-gradient(135deg,#A8764F,#8B5E3C);color:#fff;font-weight:600;box-shadow:0 6px 16px #8B5E3C40;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.ghost{background:#8B5E3C14;color:var(--acc);box-shadow:none}.btn.on svg{fill:var(--bad);stroke:var(--bad)}
.fm{display:grid;gap:12px;margin-top:12px}.fm label{display:grid;gap:4px;font-size:.85rem;color:var(--mut)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #8B5E3C22}

/* sheets */
.ov{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:#1c191766;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
.ov.on{opacity:1}
.sheet{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;background:#FFFFFFF5;border-radius:28px 28px 0 0;padding:56px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ov.on .sheet{transform:none}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:28px}}
.x{position:absolute;top:10px;inset-inline-start:10px}
.sheet h2{display:flex;align-items:center;gap:8px;font-size:1.2rem}
.dt{display:grid;grid-template-columns:116px 1fr;gap:16px}.dt .ft{font-size:.7rem;gap:4px}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.88rem;margin:10px 0}dt{color:var(--mut)}
.acts{display:flex;gap:10px;margin:16px 0}.acts .btn{flex:1}
.sub{font-size:1rem;margin:18px 0 8px}
.rv{padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.rf{display:grid;gap:8px;margin-top:12px}
.stars{display:inline-flex;align-items:center;gap:2px;color:#d6d3d1}.s{display:inline-flex}
.stars .on,.stars button.on{color:var(--soon)}.stars .on svg,.stars button.on svg{fill:var(--soon)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;margin-top:10px;border-radius:16px}
.sheet .row{cursor:pointer}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;z-index:100;max-width:90vw;text-align:center;padding:13px 24px;border-radius:999px;background:#1C1917EE;color:#fff;font-size:.92rem;opacity:0;transform:translate(-50%,20px);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:.85rem;padding:20px 12px calc(24px + env(safe-area-inset-bottom));text-align:center}

/* splash: dismisses itself with CSS only */
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#F9F8F6EB;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);animation:out .6s 3.6s forwards}
@keyframes out{to{opacity:0;visibility:hidden}}
.sp{text-align:center;color:var(--acc)}
.sp .brand{justify-content:center;margin-top:18px;font-size:1.15rem;opacity:0;animation:fi 1s .8s forwards}
.sp svg path{stroke-dasharray:200;stroke-dashoffset:200;animation:dr 1.8s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}

/* admin */
.adm{position:fixed;inset:0;z-index:60;overflow:auto;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 14px 40px}
.adm>div{max-width:900px;margin:0 auto}
.ah{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pad{padding:22px;max-width:420px;margin:30px auto}
.ctl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.ctl select{width:auto;padding:7px 10px}
</style>
</head>
<body>

<div id="splash"><div class="sp"><span data-i="logo" data-s="96"></span><div class="brand" dir="ltr"><span class="bn"></span></div></div></div>

<header class="hd glass">
  <div class="brand" dir="ltr"><span class="logo" data-i="logo" data-s="20"></span><span class="bn"></span></div>
  <label class="srch"><span data-i="search" data-s="18"></span><input id="q" type="search" placeholder="ابحث بعنوان الكتاب أو المؤلف" aria-label="بحث"></label>
  <div class="qa">
    <button id="bFav" class="ib" aria-label="المفضلة"><span data-i="heart"></span><b class="cnt" id="cFav" hidden></b></button>
    <button id="bHist" class="ib" aria-label="سجل طلباتي"><span data-i="clock"></span></button>
  </div>
</header>

<div class="ticker glass"><div id="track" class="track"></div></div>

<section class="hero" style="margin-top:0">
  <h1>مرحباً بك في مكتبتنا</h1>
  <p>اكتشف الكتب، احجز نسختك بسهولة، وشارك رأيك مع زملائك.</p>
  <div id="stats" class="stats"></div>
</section>

<nav id="filters" class="filters" aria-label="التصنيفات"></nav>
<main id="shelves"></main>
<footer><span id="ft"></span><button id="adminOpen" class="ib" aria-label="دخول الإدارة"><span data-i="lock" data-s="18"></span></button></footer>

<div id="adm" class="adm" hidden><div>
  <div class="ah"><div class="brand" dir="ltr"><span class="logo" data-i="logo" data-s="20"></span>ADMIN</div><button id="admX" class="chip"><span data-i="x" data-s="16"></span> إغلاق</button></div>
  <div id="app"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== الإعدادات: ضع بيانات Supabase هنا (مفتاح anon عام بطبيعته، والحماية تتم عبر RLS) ===== */
const CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: '',
  LIBRARY_NAME: 'LYCÉE CENTRAL LIBRARY',
  DESIGNER: 'نادر صلاح الدين'
};

/* ===== أدوات عامة ===== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const db = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ST = { available: 'متاح', borrowed: 'مستعار', coming_soon: 'قريباً' };
const SEASONS = { autumn: 'مجموعة الخريف', winter: 'مجموعة الشتاء', spring: 'مجموعة الربيع' };
const P = {
  book: '<path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  star: '<path d="m12 3.5 2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.9l6-.9z"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  pin: '<path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  out: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
P.logo = P.book;
const ic = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const icons = r => $$('[data-i]', r).forEach(el => el.innerHTML = ic(el.dataset.i, +el.dataset.s || 20));
icons();
$$('.bn').forEach(e => e.textContent = CONFIG.LIBRARY_NAME);
$('#ft').textContent = 'صُمم وابتكر بشغف من طرف: ' + CONFIG.DESIGNER;

function toast(m) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 3200);
}
function openSheet(html) {
  const o = document.createElement('div');
  o.className = 'ov';
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><button class="x ib" aria-label="إغلاق">${ic('x')}</button>${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('.x')) o.remove(); });
  document.body.append(o);
  requestAnimationFrame(() => o.classList.add('on'));
  return o;
}

/* ===== واجهة الطلاب ===== */
const KEY = { f: 'lib_favs', h: 'lib_hist' };
const ld = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const DEMO = [
  { id: 'd1', title: 'ثلاثية غرناطة', author: 'رضوى عاشور', language: 'العربية', category: 'روايات', season: 'autumn', status: 'available', is_pinned: true },
  { id: 'd2', title: 'مقدمة ابن خلدون', author: 'ابن خلدون', language: 'العربية', category: 'تاريخ', season: 'winter', status: 'borrowed', is_pinned: true },
  { id: 'd3', title: 'الأمير الصغير', author: 'أنطوان دو سانت إكزوبيري', language: 'العربية', category: 'روايات', season: 'spring', status: 'available' },
  { id: 'd4', title: 'تاريخ المغرب العربي', author: 'عبد الله العروي', language: 'العربية', category: 'تاريخ', season: 'autumn', status: 'available' },
  { id: 'd5', title: 'Les Misérables', author: 'Victor Hugo', language: 'Français', category: 'روايات', season: 'winter', status: 'borrowed' },
  { id: 'd6', title: 'قريباً: موسوعة العلوم', author: 'فريق التحرير', language: 'العربية', category: 'علوم', season: 'spring', status: 'coming_soon' }
];
let books = [], favs = ld(KEY.f), hist = ld(KEY.h), flt = 'all', q = '';

const PAL = [['#9A6A44', '#5c3b22'], ['#2F5D50', '#1b3830'], ['#2B3A55', '#16203a'], ['#7A2E3A', '#4a1520'], ['#6B6B3A', '#40401f'], ['#4A4A52', '#26262c']];
const pal = s => PAL[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % PAL.length];
const cover = b => { const [p, d] = pal(b.title); return `<div class="cv" style="--c1:${p};--c2:${d}"><div class="ft"><span>${esc(b.title)}</span><small>${esc(b.author)}</small></div>${b.cover_url ? `<img src="${esc(b.cover_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>`; };
const badge = b => `<span class="bd ${b.status}">${ST[b.status]}</span>`;
const stars = n => [1, 2, 3, 4, 5].map(i => `<span class="s ${i <= Math.round(n) ? 'on' : ''}">${ic('star', 16)}</span>`).join('');
const card = b => `<article class="card glass" data-id="${b.id}" tabindex="0"><button class="hb ${favs.includes(b.id) ? 'on' : ''}" data-h="${b.id}" aria-label="المفضلة">${ic('heart', 18)}</button>${cover(b)}<div class="meta">${badge(b)}<h3>${esc(b.title)}</h3><p>${esc(b.author)}</p></div></article>`;

function marquee(t) {
  const g = `<div class="g">${Array(4).fill(`<span>${esc(t)}</span>`).join('<i class="dot"></i>')}<i class="dot"></i></div>`;
  $('#track').innerHTML = g + g;
}

async function load() {
  if (!db) { books = DEMO; marquee('وضع تجريبي: أضف SUPABASE_URL و SUPABASE_ANON_KEY في أعلى الملف لعرض بيانات المكتبة الحقيقية'); return render(); }
  const [b, n] = await Promise.all([
    db.from('books').select('*').order('created_at', { ascending: false }),
    db.from('notices').select('*').eq('is_active', true).limit(1)
  ]);
  if (b.error) toast('تعذر تحميل الكتب. تحقق من الاتصال وأعد المحاولة');
  books = b.data || [];
  const nt = n.data?.[0] || {};
  marquee([nt.marquee_text, nt.status_note].filter(Boolean).join('   ') || 'أهلاً بكم في مكتبتنا');
  render();
}

function render() {
  const cats = [...new Set(books.map(b => b.category).filter(Boolean))];
  const chips = [['all', 'جميع الكتب'], ...Object.entries(SEASONS).map(([k, v]) => ['s:' + k, v]), ...cats.map(c => ['c:' + c, c])];
  $('#filters').innerHTML = chips.map(([k, l]) => `<button class="chip ${flt === k ? 'on' : ''}" data-f="${esc(k)}">${esc(l)}</button>`).join('');
  const cn = s => books.filter(b => b.status === s).length;
  $('#stats').innerHTML = `<span class="bd available">${cn('available')} متاح</span><span class="bd borrowed">${cn('borrowed')} مستعار</span><span class="bd coming_soon">${cn('coming_soon')} قريباً</span>`;
  const cf = $('#cFav'), nf = books.filter(b => favs.includes(b.id)).length; cf.hidden = !nf; cf.textContent = nf;
  const m = b => (!q || (b.title + ' ' + (b.author || '')).toLowerCase().includes(q)) &&
    (flt === 'all' || (flt.startsWith('s:') ? b.season === flt.slice(2) : b.category === flt.slice(2)));
  const f = books.filter(m), soon = f.filter(b => b.status === 'coming_soon'), rest = f.filter(b => b.status !== 'coming_soon');
  const pin = rest.filter(b => b.is_pinned), std = rest.filter(b => !b.is_pinned);
  $('#shelves').innerHTML = [['رف الكتب الأكثر طلباً المثبتة', pin, 'pin'], ['رف الكتب', std, 'book'], ['قريباً في المكتبة', soon, 'clock']]
    .map(([t, l, i]) => l.length ? `<section><h2>${ic(i)}${t}</h2><div class="grid">${l.map(card).join('')}</div></section>` : '').join('')
    || '<p class="empty">لا توجد كتب مطابقة. جرّب كلمة بحث أخرى أو اختر "جميع الكتب".</p>';
}

async function detail(id) {
  const b = books.find(x => x.id === id); if (!b) return;
  const o = openSheet(`<div class="dt">${cover(b)}<div><h2>${esc(b.title)}</h2><p class="mut">${esc(b.author)}</p>${badge(b)}
    <dl><dt>اللغة</dt><dd>${esc(b.language)}</dd><dt>التصنيف</dt><dd>${esc(b.category)}</dd>${SEASONS[b.season] ? `<dt>المجموعة</dt><dd>${SEASONS[b.season]}</dd>` : ''}</dl>
    <div id="avg" class="stars"></div></div></div>
    <div class="acts"><button class="btn ghost" id="fav"></button><button class="btn" id="req">${b.status === 'available' ? '+ طلب استعارة' : 'سلة الانتظار'}</button></div>
    <h3 class="sub">آراء الطلاب</h3><div id="rv"></div>
    <div class="rf"><div id="pick" class="stars pick"></div><input id="rn" placeholder="الاسم" maxlength="40"><textarea id="rc" rows="2" placeholder="اكتب رأيك في الكتاب" maxlength="300"></textarea><button class="btn ghost" id="rs">إرسال التقييم</button></div>`);
  const favBtn = () => { const on = favs.includes(id), f = $('#fav', o); f.innerHTML = ic('heart') + (on ? 'في المفضلة' : 'أضف للمفضلة'); f.classList.toggle('on', on); };
  favBtn();
  $('#fav', o).onclick = () => { toggleFav(id); favBtn(); };
  $('#req', o).onclick = () => reqForm(b);
  let rate = 0; const pick = $('#pick', o);
  pick.innerHTML = [1, 2, 3, 4, 5].map(i => `<button data-v="${i}" aria-label="${i} من 5">${ic('star', 24)}</button>`).join('');
  pick.onclick = e => { const v = e.target.closest('button')?.dataset.v; if (!v) return; rate = +v; $$('button', pick).forEach((x, i) => x.classList.toggle('on', i < rate)); };
  $('#rs', o).onclick = async () => {
    const n = $('#rn', o).value.trim();
    if (!n || !rate) return toast('أدخل اسمك واختر عدد النجوم');
    if (db) { const { error } = await db.from('reviews').insert({ book_id: id, student_name: n, rating: rate, comment: $('#rc', o).value.trim() }); if (error) return toast('تعذر إرسال التقييم، أعد المحاولة'); }
    $('#rc', o).value = ''; toast('شكراً على تقييمك'); revs();
  };
  async function revs() {
    let r = [];
    if (db) { const { data } = await db.from('reviews').select('*').eq('book_id', id).order('created_at', { ascending: false }); r = data || []; }
    $('#rv', o).innerHTML = r.map(x => `<div class="rv"><b>${esc(x.student_name)}</b> <span class="stars">${stars(x.rating)}</span><p>${esc(x.comment)}</p></div>`).join('') || '<p class="mut">لا توجد تقييمات بعد. كن أول من يقيّم هذا الكتاب.</p>';
    $('#avg', o).innerHTML = r.length ? stars(r.reduce((a, x) => a + x.rating, 0) / r.length) + `<small>(${r.length})</small>` : '';
  }
  revs();
}
function toggleFav(id) { favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id]; sv(KEY.f, favs); render(); }

function reqForm(b) {
  const last = hist[0] || {}, wait = b.status !== 'available';
  const o = openSheet(`<h2>${wait ? 'سلة الانتظار' : 'طلب استعارة'}</h2><p class="mut">${esc(b.title)}</p>
    <form id="rf" class="fm"><label>الاسم الكامل<input name="n" required maxlength="60" value="${esc(last.name)}"></label>
    <label>القسم / المستوى<input name="c" required maxlength="30" value="${esc(last.cls)}"></label>
    <label>تاريخ الطلب<input name="d" type="date" required value="${new Date().toISOString().slice(0, 10)}"></label>
    <button class="btn">إرسال الطلب</button></form>`);
  $('#rf', o).onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), r = { book_id: b.id, student_name: f.get('n').trim(), student_class: f.get('c').trim(), request_date: f.get('d') };
    if (db) { const { error } = await db.from('waitlist').insert(r); if (error) return toast('تعذر إرسال الطلب، أعد المحاولة'); }
    hist = [{ bid: b.id, title: b.title, name: r.student_name, cls: r.student_class, date: r.request_date, wait }, ...hist].slice(0, 50);
    sv(KEY.h, hist);
    $$('.ov').forEach(x => x.remove());
    toast('لا تنسوا كتبكم لأننا لن ننساكم');
  };
}

function showFavs() {
  const l = books.filter(b => favs.includes(b.id));
  const o = openSheet(`<h2>${ic('heart')}المفضلة</h2>${l.map(b => `<div class="row glass" data-id="${b.id}"><div><b>${esc(b.title)}</b><p class="mut">${esc(b.author)}</p></div>${badge(b)}</div>`).join('') || '<p class="empty">لم تضف أي كتاب بعد. اضغط على القلب فوق أي غلاف.</p>'}`);
  o.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) { o.remove(); detail(r.dataset.id); } });
}
function showHist() {
  const o = openSheet(`<h2>${ic('clock')}سجل طلباتي</h2>${hist.map(h => `<div class="row glass"><div><b>${esc(h.title)}</b><p class="mut">${esc(h.name)} - ${esc(h.cls)} - ${esc(h.date)}</p></div><span class="bd ${h.wait ? 'coming_soon' : 'available'}">${h.wait ? 'في الانتظار' : 'طلب استعارة'}</span></div>`).join('') || '<p class="empty">لا توجد طلبات على هذا الجهاز بعد.</p>'}${hist.length ? '<button class="btn ghost" id="clr" style="margin-top:14px">مسح السجل</button>' : ''}`);
  $('#clr', o)?.addEventListener('click', () => { hist = []; sv(KEY.h, hist); o.remove(); toast('تم مسح السجل'); });
}

$('#shelves').onclick = e => {
  const h = e.target.closest('[data-h]'); if (h) return toggleFav(h.dataset.h);
  const c = e.target.closest('.card'); if (c) detail(c.dataset.id);
};
$('#shelves').onkeydown = e => { if (e.key === 'Enter' && !e.target.closest('[data-h]')) { const c = e.target.closest('.card'); if (c) detail(c.dataset.id); } };
$('#filters').onclick = e => { const c = e.target.closest('.chip'); if (c) { flt = c.dataset.f; render(); } };
$('#q').oninput = e => { q = e.target.value.toLowerCase().trim(); render(); };
$('#bFav').onclick = showFavs; $('#bHist').onclick = showHist;

/* ===== لوحة الإدارة (داخل نفس الملف) ===== */
const app = $('#app');
const opt = (m, s) => Object.entries(m).map(([k, v]) => `<option value="${k}" ${k === s ? 'selected' : ''}>${v}</option>`).join('');

async function openAdmin() {
  $('#adm').hidden = false; document.body.style.overflow = 'hidden';
  if (!db) { app.innerHTML = '<p class="empty">أضف SUPABASE_URL و SUPABASE_ANON_KEY في أعلى الملف لتفعيل لوحة الإدارة.</p>'; return; }
  const { data: { session } } = await db.auth.getSession();
  session ? dash() : login();
}
$('#adminOpen').onclick = openAdmin;
$('#admX').onclick = () => { $('#adm').hidden = true; document.body.style.overflow = ''; load(); };

function login() {
  app.innerHTML = `<form id="lf" class="fm glass pad"><h2>دخول الإدارة</h2>
    <label>البريد الإلكتروني<input name="e" type="email" required autocomplete="username"></label>
    <label>كلمة المرور<input name="p" type="password" required autocomplete="current-password"></label><button class="btn">دخول</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const { error } = await db.auth.signInWithPassword({ email: f.get('e'), password: f.get('p') });
    error ? toast('البريد أو كلمة المرور غير صحيحة') : dash();
  };
}

function dash() {
  app.innerHTML = `<div class="tabs"><button class="chip on" data-t="b">الكتب</button><button class="chip" data-t="r">الطلبات المعلقة</button><button class="chip" data-t="n">إشعار اليوم</button><button class="chip" id="out">${ic('out', 16)} خروج</button></div><div id="pane"></div>`;
  $('.tabs').onclick = e => {
    const t = e.target.closest('[data-t]'); if (!t) return;
    $$('.tabs .chip').forEach(x => x.classList.toggle('on', x === t));
    ({ b: tBooks, r: tReqs, n: tNotice })[t.dataset.t]();
  };
  $('#out').onclick = async () => { await db.auth.signOut(); login(); };
  tBooks();
}

async function tBooks() {
  const pane = $('#pane');
  const { data, error } = await db.from('books').select('*').order('created_at', { ascending: false });
  if (error) toast('تعذر تحميل الكتب');
  books = data || [];
  pane.innerHTML = `<button class="btn" id="add">${ic('plus', 18)} إضافة كتاب</button><div class="list">${books.map(b => `
    <div class="row glass" data-id="${b.id}"><div><b>${esc(b.title)}</b><p class="mut">${esc(b.author)}</p></div>
    <div class="ctl"><select data-s aria-label="الحالة">${opt(ST, b.status)}</select>
    <button class="ib ${b.is_pinned ? 'on' : ''}" data-a="pin" aria-label="تثبيت">${ic('pin')}</button>
    <button class="ib" data-a="edit" aria-label="تعديل">${ic('edit')}</button>
    <button class="ib" data-a="del" aria-label="حذف">${ic('trash')}</button></div></div>`).join('') || '<p class="empty">لا توجد كتب بعد. اضغط "إضافة كتاب" للبدء.</p>'}</div>`;
  pane.onclick = async e => {
    if (e.target.closest('#add')) return bookForm();
    const r = e.target.closest('.row'), a = e.target.closest('[data-a]')?.dataset.a; if (!r || !a) return;
    const b = books.find(x => x.id === r.dataset.id);
    if (a === 'edit') return bookForm(b);
    if (a === 'pin') await db.from('books').update({ is_pinned: !b.is_pinned }).eq('id', b.id);
    if (a === 'del') { if (!confirm('حذف هذا الكتاب نهائياً؟')) return; await db.from('books').delete().eq('id', b.id); }
    tBooks();
  };
  pane.onchange = async e => {
    if (!e.target.dataset.s) return;
    const { error } = await db.from('books').update({ status: e.target.value }).eq('id', e.target.closest('.row').dataset.id);
    toast(error ? 'تعذر التحديث' : 'تم تحديث الحالة');
  };
}

function bookForm(b = {}) {
  const o = openSheet(`<h2>${b.id ? 'تعديل كتاب' : 'إضافة كتاب'}</h2><form id="bf" class="fm">
    <label>رابط الغلاف (اختياري)<input name="cover_url" type="url" value="${esc(b.cover_url)}" dir="ltr"></label>
    <label>العنوان<input name="title" required value="${esc(b.title)}"></label>
    <label>المؤلف<input name="author" value="${esc(b.author)}"></label>
    <label>اللغة<input name="language" value="${esc(b.language || 'العربية')}"></label>
    <label>التصنيف<input name="category" value="${esc(b.category)}"></label>
    <label>الموسم<select name="season">${opt({ all: 'كل المواسم', autumn: 'الخريف', winter: 'الشتاء', spring: 'الربيع' }, b.season)}</select></label>
    <label>الحالة<select name="status">${opt(ST, b.status)}</select></label><button class="btn">حفظ الكتاب</button></form>`);
  $('#bf', o).onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    const { error } = b.id ? await db.from('books').update(v).eq('id', b.id) : await db.from('books').insert(v);
    if (error) return toast('تعذر حفظ الكتاب، راجع الحقول وأعد المحاولة');
    o.remove(); toast('تم حفظ الكتاب'); tBooks();
  };
}

async function tReqs() {
  const pane = $('#pane'); pane.onclick = pane.onchange = null;
  const { data } = await db.from('waitlist').select('*,books(id,title)').order('request_date');
  pane.innerHTML = `<div class="list">${(data || []).map(r => `<div class="row glass" data-id="${r.id}" data-b="${r.book_id}"><div><b>${esc(r.books?.title)}</b><p class="mut">${esc(r.student_name)} - ${esc(r.student_class)} - ${esc(r.request_date)}</p></div><button class="btn" data-a="ok">${ic('check', 18)} تأكيد التسليم</button></div>`).join('') || '<p class="empty">لا توجد طلبات معلقة الآن.</p>'}</div>`;
  pane.onclick = async e => {
    const r = e.target.closest('.row'); if (!r || !e.target.closest('[data-a=ok]')) return;
    const u = await db.from('books').update({ status: 'borrowed' }).eq('id', r.dataset.b);
    if (u.error) return toast('تعذر تحديث حالة الكتاب');
    await db.from('waitlist').delete().eq('id', r.dataset.id);
    toast('تم تسجيل الإعارة'); tReqs();
  };
}

async function tNotice() {
  const pane = $('#pane'); pane.onclick = pane.onchange = null;
  const { data } = await db.from('notices').select('*').eq('is_active', true).limit(1);
  const n = data?.[0] || {};
  pane.innerHTML = `<form id="nf" class="fm glass pad"><label>شريط الإعلانات: ساعات الدوام وأيام الإغلاق<textarea name="marquee_text" rows="3">${esc(n.marquee_text)}</textarea></label>
    <label>ملاحظة اليوم<textarea name="status_note" rows="2">${esc(n.status_note)}</textarea></label><button class="btn">نشر التحديث</button></form>`;
  $('#nf').onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    const { error } = n.id ? await db.from('notices').update(v).eq('id', n.id) : await db.from('notices').insert({ ...v, is_active: true });
    toast(error ? 'تعذر النشر' : 'تم نشر التحديث');
  };
}

/* ===== التشغيل ===== */
load();
if (location.hash === '#admin') openAdmin();
if (db) db.channel('live').on('postgres_changes', { event: '*', schema: 'public', table: 'notices' }, load).on('postgres_changes', { event: '*', schema: 'public', table: 'books' }, load).subscribe();
</script>
</body>
</html>
